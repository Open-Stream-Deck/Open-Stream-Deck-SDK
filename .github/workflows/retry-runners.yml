name: Retry unavailable runners

on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const params = { ...context.repo, run_id: run.id };
            const { data: current } = await github.rest.actions.getWorkflowRun(params);
            if (current.status !== "completed" || current.run_attempt !== run.run_attempt) return;

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRunAttempt,
              { ...params, attempt_number: run.run_attempt, per_page: 100 },
            );
            const failed = jobs.filter(job =>
              ["failure", "cancelled", "timed_out"].includes(job.conclusion),
            );
            // No runner and no steps means the job never started; do not retry code failures.
            if (!failed.length || !failed.every(job =>
              job.runner_id === 0 && job.steps.length === 0,
            )) return;

            core.info(`Retrying unavailable runners, attempt ${run.run_attempt + 1}/3`);
            await github.rest.actions.reRunWorkflowFailedJobs(params);
