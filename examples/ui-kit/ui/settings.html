<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>UI Kit</title>
  <link rel="stylesheet" href="/_opensd/inspector.css">
  <script src="/_opensd/inspector.js"></script>
</head>
<body>
  <section>
    <h1>Окно плагина</h1>
    <p>Общие настройки плагина. Поля с <code>data-global</code> сохраняются для всех кнопок сразу.</p>
  </section>

  <section class="card">
    <label>Сервер <input type="url" data-global="server" placeholder="http://127.0.0.1:8080" spellcheck="false"></label>
    <label>Токен <input type="password" data-global="token" placeholder="Необязательно"></label>
    <label>
      Обновлять
      <select data-global="interval">
        <option value="1">Каждую минуту</option>
        <option value="10">Каждые 10 минут</option>
        <option value="60">Раз в час</option>
      </select>
    </label>
    <label>Подробный журнал <input type="checkbox" data-global="verbose"></label>
    <div class="cluster">
      <button class="button button--primary" id="check">Проверить</button>
      <span class="status status--off" id="status">Не проверено</span>
    </div>
  </section>

  <script>
    const status = document.getElementById("status");
    const check = document.getElementById("check");

    check.onclick = () => {
      check.setAttribute("aria-busy", "true");
      status.className = "status status--busy";
      status.textContent = "Проверка";
      opensd.send({ check: opensd.globals.server || null });
    };
    opensd.on("message", (reply) => {
      check.removeAttribute("aria-busy");
      status.className = "status";
      status.textContent = `Плагин ответил в ${reply.at}`;
    });
  </script>
</body>
</html>
