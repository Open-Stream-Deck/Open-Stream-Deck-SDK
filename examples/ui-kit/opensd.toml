sdk = 1
id = "dev.opensd.uikit"
name = "UI Kit"
version = "1.0.0"
author = "Open Stream Deck"
description = "Все компоненты UI кита на странице кнопки и в окне плагина"
icon = "assets/icon.svg"

[runtime]
type = "js"
main = "plugin.js"

[ui]
inspector = "ui/inspector.html"
settings = "ui/settings.html"

[[actions]]
id = "dev.opensd.uikit.demo"
name = "UI Kit"
description = "Страница настроек со всеми компонентами"
icon = "assets/key.svg"
controllers = ["key"]
settings = { name = "UI", note = "", mode = "auto", count = 1, hotkey = "", enabled = true, brightness = 60, speed = "normal", background = "#1b1b1b", size = "m", align = "bottom", days = ["mon", "fri"], color = "#0a84ff", source = "file", loop = false }

[[actions.states]]
image = "assets/key.svg"
