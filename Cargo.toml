[workspace]
members = ["crates/opensd", "crates/opensd-package", "crates/opensd-cli"]
resolver = "3"

[workspace.package]
version = "1.0.2"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["whxtelxs"]
repository = "https://github.com/Open-Stream-Deck/Open-Stream-Deck-SDK"
homepage = "https://wiki.opensd.dev/docs/sdk"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opensd-package = { path = "crates/opensd-package", version = "1.0.2" }

[profile.release]
strip = true
codegen-units = 1
lto = "thin"
